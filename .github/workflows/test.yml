name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Selftest (네트워크·LLM 불필요)
        run: python -m carbonledger.cli selftest
      - name: Golden 대조 (LLM 목킹)
        run: python tests/test_golden.py
      - name: 백엔드 계약 (HTTP 목킹)
        run: python tests/test_backends.py
      - name: 회귀 (재검토 확정 결함 고정)
        run: python tests/test_regressions.py
      - name: MCP 도구 계약 (SDK 없이 — 구현 함수만)
        run: python tests/test_mcp.py
      - name: MCP 서버 등록 (SDK 설치 후)
        run: |
          pip install -e ".[mcp]"
          python tests/test_mcp.py
